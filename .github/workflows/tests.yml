name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.8"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.13"}
          - {os: windows-latest, python: "3.14"}
          - {os: ubuntu-22.04, python: "3.8"}     # newer Ubuntu images no longer offer Python 3.8
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Evaluation tasks from the source launcher
        run: python ecuh.py eval run
      - name: Single-file build runs too
        run: |
          python tools/build_pyz.py
          python dist/ecuh.pyz eval run
